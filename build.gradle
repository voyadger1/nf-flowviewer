plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.15'
}

version = System.getenv("GITHUB_REF_NAME") ? System.getenv("GITHUB_REF_NAME").replaceAll(/^v/, '') : '0.0.1-SNAPSHOT'

nextflowPlugin {
    nextflowVersion = '25.10.0'

    provider = 'voyadgerodin'
    className = 'voyadgerodin.plugin.FlowviewerPlugin'
    extensionPoints = [
        'voyadgerodin.plugin.FlowviewerExtension',
        'voyadgerodin.plugin.FlowviewerFactory'
    ]

}
